<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Viagens</title>
    <link rel="stylesheet" href="./css/taskflow.css" />
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/5495/5495443.png" type="image/x-icon">
  </head>
  <body>
    <div class="login" id="login" role="dialog" aria-modal="true" aria-labelledby="login-titulo">
      <form class="login__cartao" id="form-login">
        <div class="login__icone" aria-hidden="true">✈</div>
        <h2 id="login-titulo">Acesse o Planejamento</h2>
        <p class="login__descricao" id="login-descricao">Entre para gerenciar suas viagens.</p>
        <div class="campo">
          <label class="campo__rotulo" for="usuario">Usuário</label>
          <input class="campo__entrada" id="usuario" name="usuario" autocomplete="username" />
        </div>
        <div class="campo">
          <label class="campo__rotulo" for="senha">Senha</label>
          <input class="campo__entrada" id="senha" name="senha" type="password" autocomplete="current-password" />
        </div>
        <div class="campo" id="campo-confirmar-senha" hidden>
          <label class="campo__rotulo" for="confirmar-senha">Confirmar senha</label>
          <input class="campo__entrada" id="confirmar-senha" name="confirmar-senha" type="password" autocomplete="new-password" />
        </div>
        <p class="campo__erro" id="erro-login" role="alert"></p>
        <button class="botao botao--primario" id="botao-login" type="submit">Entrar</button>
        <button class="botao botao--secundario" id="botao-criar-conta" type="button">Criar conta</button>
        <button class="botao botao--texto" id="botao-voltar-login" type="button" hidden>Já tenho uma conta</button>
      </form>
    </div>

    <header class="cabecalho">
      <h1 class="cabecalho__titulo"><span id="nome-do-sistema"></span></h1>
      <p class="cabecalho__subtitulo">
        <span id="versao">—</span> · <span id="data-de-hoje">—</span>
      </p>
      <div class="cabecalho__acoes">
        <button class="botao-tema" id="botao-tema" type="button" aria-label="Ativar tema escuro">🌙 Tema escuro</button>
        <span class="usuario-logado" id="usuario-logado"></span>
        <button class="botao-tema" id="botao-sair" type="button">Sair</button>
      </div>
    </header>

    <!-- Total / Pendentes: ACIMA do formulário, centralizados -->
    <ul class="estatisticas" aria-label="Resumo das viagens">
      <li class="estatistica">
        <span class="estatistica__numero" id="total">0</span>
        <span class="estatistica__rotulo">Total</span>
      </li>
      <li class="estatistica">
        <span class="estatistica__numero" id="pendentes">0</span>
        <span class="estatistica__rotulo">Pendentes</span>
      </li>
    </ul>

    <form class="formulario" id="formulario" novalidate>
      <div class="campo">
        <label class="campo__rotulo" for="titulo">Título</label>
        <input
          class="campo__entrada"
          id="titulo"
          name="titulo"
          type="text"
          autocomplete="off"
        />
      </div>

      <div class="campo">
        <label class="campo__rotulo" for="destino">Destino</label>
        <input
          class="campo__entrada"
          id="destino"
          name="destino"
          type="text"
          autocomplete="off"
        />
      </div>

      <div class="campo">
        <label class="campo__rotulo" for="origem">Local de Origem</label>
        <input
          class="campo__entrada"
          id="origem"
          name="origem"
          type="text"
          autocomplete="off"
        />
      </div>

      <div class="campo">
        <label class="campo__rotulo" for="data-viagem">Data da Viagem</label>
        <input
          class="campo__entrada"
          id="data-viagem"
          name="dataViagem"
          type="date"
        />
      </div>

      <div class="campo">
        <label class="campo__rotulo" for="data-retorno">Data de Retorno</label>
        <input
          class="campo__entrada"
          id="data-retorno"
          name="dataRetorno"
          type="date"
        />
      </div>

      <div class="campo">
        <label class="campo__rotulo" for="motivo">Motivo da Viagem</label>
        <input
          class="campo__entrada"
          id="motivo"
          name="motivo"
          type="text"
          autocomplete="off"
        />
      </div>

      <div class="acoes-formulario">
        <button class="botao botao--primario" type="submit">Cadastrar</button>
        <button class="botao botao--secundario" id="limpar" type="button">Limpar</button>
      </div>
    </form>

    <p class="campo__erro" id="erro" role="alert"></p>

    <main class="conteudo">
      <p class="aviso" id="comece-por" hidden></p>
      <ul class="lista" id="lista"></ul>
    </main>
    <footer>
      <h3>Autores Do Site:</h3>
      <p>&copy;Thiago Gandra</p>
      <p>Jonhnes Emanuel</p>
      <p>Danilo Nascimento</p>
    </footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
